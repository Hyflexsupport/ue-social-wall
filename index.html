<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UE Social Wall · Prueba RoomCast</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c17;color:white;font-family:Arial,sans-serif}.stage{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;gap:4vw;background:radial-gradient(ellipse at center,#1b2945 0%,#080c17 75%)}.side{flex:1;text-align:center;min-width:0}.side h1{font-size:clamp(18px,3vw,70px);letter-spacing:.1em;margin:0 0 20px}.side p{color:#aebbd1;font-size:clamp(12px,1.6vw,35px)}.player{height:94vh;aspect-ratio:9/16;max-width:40vw;position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 0 40px #0008}video{width:100%;height:100%;object-fit:contain}.status{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-size:12px;color:#fff;background:#0009;padding:6px;border-radius:4px}.counter{position:absolute;top:12px;right:12px;background:#0008;border-radius:30px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div class="stage"><div class="side"><h1>UNIVERSIDAD<br>EUROPEA</h1><p>Social Wall · Prueba técnica</p></div><div class="player"><video id="video" autoplay muted playsinline preload="auto"></video><div class="counter" id="counter">1 / 3</div><div class="status" id="status">Cargando vídeo…</div></div><div class="side"><h1>VIDA EN<br>EL CAMPUS</h1><p>Instagram · Facebook · TikTok</p></div></div>
<script>
// Vídeos de demostración externos; pueden no estar disponibles en todas las redes.
// Sustituir por archivos propios autorizados para la versión definitiva.
const clips=[
'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4'
];
const video=document.getElementById('video'),status=document.getElementById('status'),counter=document.getElementById('counter');
let index=0,errors=0;
function next(){index=(index+1)%clips.length;load()}
function load(){counter.textContent=`${index+1} / ${clips.length}`;status.textContent='Cargando vídeo…';video.src=clips[index];video.load();video.play().catch(()=>{status.textContent='Autoplay bloqueado o vídeo no disponible';});}
video.addEventListener('playing',()=>{status.style.display='none';errors=0});
video.addEventListener('ended',next);
video.addEventListener('error',()=>{status.style.display='block';status.textContent='Error de vídeo; probando siguiente…';if(++errors<clips.length)setTimeout(next,1500);else status.textContent='No se han podido cargar los vídeos. Revisar conexión y compatibilidad.'});
video.addEventListener('stalled',()=>{status.style.display='block';status.textContent='Esperando conexión…'});
load();
</script>
</body></html>
